[project]
name = "python-cheat-sheet"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyter-client>=8.10.0",
    "markdown-it-py>=4.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[project.scripts]
cheatsheet = "cheatsheet.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cheatsheet"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-playwright>=0.10.0",
]
