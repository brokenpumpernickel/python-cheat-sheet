# Tests and builds on every pull request and push to main; deploys to GitHub Pages only from main.
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Fail instead of re-locking if uv.lock is out of date.
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no major-version tags.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.10"
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install Python and libraries
        run: uv sync

      - name: Install Node dependencies
        run: npm ci
        working-directory: site

      - name: Install Chromium for Playwright
        run: uv run playwright install --with-deps chromium

      - name: Run tests
        run: uv run pytest

      # Runs every example in the real content folder, so a broken example fails the check.
      - name: Build content and site
        run: uv run cheatsheet build --base /python-cheat-sheet/

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
